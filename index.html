<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Scientific Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Roboto+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator">
        <!-- Display Panel -->
        <div class="display-panel">
            <div class="expression-input" id="expressionInput">
                <span id="expressionText"></span>
                <span class="cursor" id="cursor">|</span>
            </div>
            <div class="live-preview" id="livePreview"></div>
        </div>

        <!-- Mode Switcher -->
        <div class="mode-switcher">
            <button class="mode-btn active" data-mode="basic">Basic</button>
            <button class="mode-btn" data-mode="scientific">Scientific</button>
            <button class="mode-btn" data-mode="advanced">Advanced</button>
            <button class="mode-btn" data-mode="graph">Graph</button>
            <button class="mode-btn" data-mode="programmer">Programmer</button>
        </div>

        <!-- Content Area with Proper Panel Structure -->
        <div class="content-area">
            <!-- Basic Keys Panel -->
            <div class="keys-panel" id="basicKeys">
                <div class="key-row">
                    <button class="key clear" data-value="C">C</button>
                    <button class="key clear" data-value="CE">CE</button>
                    <button class="key operator" data-value="%">%</button>
                    <button class="key operator" data-value="/">÷</button>
                    <button class="key clear" data-value="DEL">⌫</button>
                </div>
                <div class="key-row">
                    <button class="key number" data-value="7">7</button>
                    <button class="key number" data-value="8">8</button>
                    <button class="key number" data-value="9">9</button>
                    <button class="key operator" data-value="*">×</button>
                    <button class="key function" data-value="^">x^y</button>
                </div>
                <div class="key-row">
                    <button class="key number" data-value="4">4</button>
                    <button class="key number" data-value="5">5</button>
                    <button class="key number" data-value="6">6</button>
                    <button class="key operator" data-value="-">−</button>
                    <button class="key function" data-value="√">√</button>
                </div>
                <div class="key-row">
                    <button class="key number" data-value="1">1</button>
                    <button class="key number" data-value="2">2</button>
                    <button class="key number" data-value="3">3</button>
                    <button class="key operator" data-value="+">+</button>
                    <button class="key function" data-value="1/x">1/x</button>
                </div>
                <div class="key-row">
                    <button class="key number zero" data-value="0">0</button>
                    <button class="key decimal" data-value=".">.</button>
                    <button class="key equals" data-value="=">=</button>
                    <button class="key function" data-value="±">±</button>
                </div>
            </div>

            <!-- Scientific Keys Panel -->
            <div class="keys-panel hidden" id="scientificKeys">
                <div class="key-row">
                    <button class="key function" data-value="sin">sin</button>
                    <button class="key function" data-value="cos">cos</button>
                    <button class="key function" data-value="tan">tan</button>
                    <button class="key parentheses" data-value="(">(</button>
                    <button class="key parentheses" data-value=")">)</button>
                </div>
                <div class="key-row">
                    <button class="key function" data-value="asin">sin⁻¹</button>
                    <button class="key function" data-value="acos">cos⁻¹</button>
                    <button class="key function" data-value="atan">tan⁻¹</button>
                    <button class="key constant" data-value="π">π</button>
                    <button class="key operator" data-value="^">x^y</button>
                </div>
                <div class="key-row">
                    <button class="key function" data-value="log">log</button>
                    <button class="key function" data-value="ln">ln</button>
                    <button class="key function" data-value="√">√</button>
                    <button class="key constant" data-value="e">e</button>
                    <button class="key operator" data-value="!">x!</button>
                </div>
                <div class="key-row">
                    <button class="key function" data-value="10^x">10ˣ</button>
                    <button class="key function" data-value="e^x">eˣ</button>
                    <button class="key function" data-value="x^2">x²</button>
                    <button class="key operator" data-value="/">÷</button>
                    <button class="key clear" data-value="C">C</button>
                </div>
                <div class="key-row">
                    <button class="key number" data-value="7">7</button>
                    <button class="key number" data-value="8">8</button>
                    <button class="key number" data-value="9">9</button>
                    <button class="key operator" data-value="*">×</button>
                    <button class="key clear" data-value="CE">CE</button>
                </div>
                <div class="key-row">
                    <button class="key number" data-value="4">4</button>
                    <button class="key number" data-value="5">5</button>
                    <button class="key number" data-value="6">6</button>
                    <button class="key operator" data-value="-">−</button>
                    <button class="key equals" data-value="=">=</button>
                </div>
                <div class="key-row">
                    <button class="key number" data-value="1">1</button>
                    <button class="key number" data-value="2">2</button>
                    <button class="key number" data-value="3">3</button>
                    <button class="key operator" data-value="+">+</button>
                </div>
                <div class="key-row">
                    <button class="key number zero" data-value="0">0</button>
                    <button class="key decimal" data-value=".">.</button>
                    <button class="key function" data-value="±">±</button>
                </div>
            </div>

            <!-- Advanced Function Panel -->
            <div class="advanced-panel hidden" id="advancedPanel">
                <div class="advanced-tabs">
                    <button class="tab-btn active" data-tab="algebra">Algebra</button>
                    <button class="tab-btn" data-tab="calculus">Calculus</button>
                    <button class="tab-btn" data-tab="matrix">Matrix</button>
                    <button class="tab-btn" data-tab="stats">Stats</button>
                    <button class="tab-btn" data-tab="complex">Complex</button>
                    <button class="tab-btn" data-tab="units">Units</button>
                </div>
                <div class="tab-content" id="tabContent">
                    <!-- Tab contents will be dynamically loaded -->
                </div>
            </div>

            <!-- Graphing Canvas Panel -->
            <div class="graph-canvas hidden" id="graphCanvas">
                <div class="graph-header">
                    <input type="text" id="functionInput" placeholder="Enter function: e.g., x^2, sin(x), x^3-2*x+1">
                    <div class="graph-controls">
                        <button id="plotBtn">Plot</button>
                        <button id="clearGraphBtn">Clear</button>
                        <button id="zoomInBtn">Zoom In</button>
                        <button id="zoomOutBtn">Zoom Out</button>
                    </div>
                </div>
                <canvas id="graph" width="400" height="300"></canvas>
            </div>

            <!-- Programmer Calculator Panel -->
            <div class="keys-panel hidden" id="programmerKeys">
                <div class="key-row">
                    <button class="key clear" data-value="C">C</button>
                    <button class="key clear" data-value="CE">CE</button>
                    <button class="key operator" data-value="&">AND</button>
                    <button class="key operator" data-value="|">OR</button>
                    <button class="key operator" data-value="^">XOR</button>
                </div>
                <div class="key-row">
                    <button class="key function" data-value="~">NOT</button>
                    <button class="key function" data-value="<<">LSH</button>
                    <button class="key function" data-value=">>">RSH</button>
                    <button class="key function" data-value="bin">BIN</button>
                    <button class="key function" data-value="dec">DEC</button>
                </div>
                <div class="key-row">
                    <button class="key number" data-value="A">A</button>
                    <button class="key number" data-value="B">B</button>
                    <button class="key number" data-value="C">C</button>
                    <button class="key number" data-value="D">D</button>
                    <button class="key number" data-value="E">E</button>
                </div>
                <div class="key-row">
                    <button class="key number" data-value="F">F</button>
                    <button class="key number" data-value="7">7</button>
                    <button class="key number" data-value="8">8</button>
                    <button class="key number" data-value="9">9</button>
                    <button class="key operator" data-value="/">÷</button>
                </div>
                <div class="key-row">
                    <button class="key number" data-value="4">4</button>
                    <button class="key number" data-value="5">5</button>
                    <button class="key number" data-value="6">6</button>
                    <button class="key operator" data-value="*">×</button>
                    <button class="key clear" data-value="C">C</button>
                </div>
                <div class="key-row">
                    <button class="key number" data-value="1">1</button>
                    <button class="key number" data-value="2">2</button>
                    <button class="key number" data-value="3">3</button>
                    <button class="key operator" data-value="-">−</button>
                    <button class="key equals" data-value="=">=</button>
                </div>
                <div class="key-row">
                    <button class="key number zero" data-value="0">0</button>
                    <button class="key decimal" data-value=".">.</button>
                    <button class="key function" data-value="oct">OCT</button>
                    <button class="key function" data-value="hex">HEX</button>
                </div>
            </div>
        </div>

        <!-- History Panel -->
        <div class="history-panel" id="historyPanel">
            <div class="history-header">History</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script src="parser/tokenizer.js"></script>
    <script src="parser/ast.js"></script>
    <script src="parser/evaluator.js"></script>
    <script src="utils/constants.js"></script>
    <script src="utils/precision.js"></script>
    <script src="utils/helpers.js"></script>
    <script src="ui/display.js"></script>
    <script src="ui/buttons.js"></script>
    <script src="ui/panels.js"></script>
    <script src="modules/algebra.js"></script>
    <script src="modules/calculus.js"></script>
    <script src="modules/matrix.js"></script>
    <script src="modules/complex.js"></script>
    <script src="modules/graphing.js"></script>
    <script src="modules/stats.js"></script>
    <script src="modules/programmer.js"></script>
    <script src="modules/units.js"></script>
    <script src="app.js"></script>
</body>
</html>
